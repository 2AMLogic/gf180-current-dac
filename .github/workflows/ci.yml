name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: JSON, harness self-test, README links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # layout/gen_array.py needs the pip klayout pinned in layout/toolchain.json
      - run: pip install klayout==0.30.12
      - run: python3 scripts/check_ci.py

  signoff:
    name: klt signoff record is fresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      # the item 10 attestation re-runs scripts/check_ci.py, which needs klayout
      - run: pip install klayout==0.30.12
      # Pin lives in scripts/check_signoff.sh (KLT_PIN, default 0.8.0).
      - name: Re-run klt signoff and compare against the committed record
        run: scripts/check_signoff.sh
      - name: Re-attest item 10 (repo hygiene) and compare against the committed envelope
        run: uvx --from klayout-tools==0.8.0 klt signoff --attest 10 --inventory attest/item10.json --check evidence/item10.json
