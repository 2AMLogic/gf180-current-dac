name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: JSON, harness self-test, README links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # layout/gen_array.py needs the pip klayout read from klayout_package_pin
      # in layout/toolchain.json — never restate the version here, so a pin bump
      # cannot leave CI installing something else (issue #87)
      - run: pip install "klayout==$(python3 -I -c 'import json;print(json.load(open("layout/toolchain.json"))["klayout_package_pin"])')"
      - run: |
          set -o pipefail
          python3 scripts/check_ci.py 2>&1 | tee "$RUNNER_TEMP/check_ci.log"
          # CI installs the pin, so gen_array --check must land on the strict
          # path; a divergence must fail here, not silently relax the gate
          grep -q klayout_mode=strict "$RUNNER_TEMP/check_ci.log"
        # check_ci.py resolves WORK_LOG.md citations against the forge REST
        # API (issue #113); without the token the gate would only SKIP
        env:
          GITHUB_TOKEN: ${{ github.token }}

  signoff:
    name: klt signoff record is fresh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      # the item 10 attestation re-runs scripts/check_ci.py, which needs klayout
      - run: pip install "klayout==$(python3 -I -c 'import json;print(json.load(open("layout/toolchain.json"))["klayout_package_pin"])')"
      # Pin lives in scripts/check_signoff.sh (KLT_PIN), resolved via scripts/check_signoff.sh --print-pin.
      - name: Re-run klt signoff and compare against the committed record
        run: scripts/check_signoff.sh
      # Editing ci.yml, README.md or LICENSE (this file included) drifts the
      # item 10 envelope: re-attest item 10 (command in the README reproduce
      # table) before regenerating the signoff record, or the regression
      # ships as the new baseline.
      - name: Re-attest item 10 (repo hygiene) and compare against the committed envelope
        run: uvx --from "klayout-tools==$(scripts/check_signoff.sh --print-pin)" klt signoff --attest 10 --inventory attest/item10.json --check evidence/item10.json
      # cold_start is local_only (needs ngspice >= 46 and the batch fleet), so --check skips it
      - name: Re-attest item 9 (testbench inventory) and compare against the committed envelope
        run: uvx --from "klayout-tools==$(scripts/check_signoff.sh --print-pin)" klt signoff --attest 9 --inventory attest/item9.json --check evidence/item9.json
